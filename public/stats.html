<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Training run</title><style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#000;color:#eee}*{box-sizing:border-box}body{margin:0;background:#000}main{max-width:780px;margin:auto;min-height:100dvh;padding:22px 22px max(14px,env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}h1{font-size:18px;font-weight:600;letter-spacing:-.5px;margin:0}a{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#eee;text-decoration:none}a:hover{background:#1c1c1c}a:focus-visible{outline:2px solid #777;outline-offset:3px}header svg{width:22px;height:22px}#status{color:#999;font-size:13px;margin:0 0 32px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 20px}.card{padding:0;background:none;border:0}.label{font-size:12px;color:#777;margin-bottom:8px}.value{font-size:25px;font-weight:400;letter-spacing:-.8px;font-variant-numeric:tabular-nums}.chart{padding:0;background:none;border:0;margin-top:42px}h2{font-size:13px;color:#999;font-weight:400;margin:0 0 20px}.chart svg{display:block;width:100%;height:auto}.chart svg text{font:11px system-ui;fill:#777}.note{color:#666;font-size:11px;line-height:1.7;margin-top:15px}progress{appearance:none;-webkit-appearance:none;width:100%;height:3px;border:0;background:#181818;border-radius:99px;margin-top:30px;overflow:hidden}progress::-webkit-progress-bar{background:#181818;border-radius:99px}progress::-webkit-progress-value{background:#aaa;border-radius:99px}progress::-moz-progress-bar{background:#aaa;border-radius:99px}#meta{color:#888;font-size:12px;line-height:1.8;margin-top:28px}@media(max-width:580px){main{padding:16px 16px max(12px,env(safe-area-inset-bottom))}.grid{grid-template-columns:repeat(2,1fr);gap:28px 20px}.value{font-size:23px}header{margin-bottom:30px}}
</style></head><body><main><header><h1>Training run</h1><a href="/" aria-label="Back to chat" title="Back to chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></a></header><p id="status" role="status">Connecting…</p><div class="grid" id="cards"></div><progress id="progress" value="0" max="100" aria-label="Run progress"></progress><section class="chart"><h2>Training loss</h2><svg id="training-chart" viewBox="0 0 820 280" role="img" aria-label="Training loss over training steps"></svg></section><section class="chart"><h2>Validation loss</h2><svg id="chart" viewBox="0 0 820 280" role="img" aria-label="Validation loss over training steps"></svg></section><div id="meta"></div><p class="note" id="freshness"></p></main><script>
const $=id=>document.getElementById(id),fmt=n=>Number.isFinite(n)?n.toFixed(3):'—',time=s=>Number.isFinite(s)?Math.floor(s/60)+'m '+Math.floor(s%60)+'s':'—';
function card(label,value){const el=document.createElement('div');el.className='card';const name=document.createElement('div');name.className='label';name.textContent=label;const val=document.createElement('div');val.className='value';val.textContent=value;el.append(name,val);return el;}
function plot(rows,id='chart',key='val_loss'){const svg=$(id);svg.replaceChildren();if(!rows.length)return;const ns='http://www.w3.org/2000/svg',make=(tag,attrs,text)=>{const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;svg.append(e);return e;};const values=rows.map(r=>r[key]),min=Math.min(...values),max=Math.max(...values),pad=Math.max(.03,(max-min)*.1),lo=min-pad,hi=max+pad,x0=rows[0].step,x1=rows.at(-1).step;const x=v=>55+(v-x0)/Math.max(1,x1-x0)*745,y=v=>230-(v-lo)/(hi-lo)*205;for(let i=0;i<5;i++){const v=lo+(hi-lo)*i/4;make('line',{x1:55,x2:800,y1:y(v),y2:y(v),stroke:'#262626'});make('text',{x:45,y:y(v)+4,'text-anchor':'end'},v.toFixed(2));}make('polyline',{points:rows.map(r=>x(r.step)+','+y(r[key])).join(' '),fill:'none',stroke:'#ddd','stroke-width':2});const last=rows.at(-1);make('circle',{cx:x(last.step),cy:y(last[key]),r:3,fill:'#ddd'});make('text',{x:55,y:260},String(x0));make('text',{x:800,y:260,'text-anchor':'end'},String(x1));make('text',{x:425,y:276,'text-anchor':'middle'},'Step');}
async function update(){try{const res=await fetch('/api/stats',{cache:'no-store'});if(!res.ok)throw Error('Server unavailable');const data=await res.json();if(!data.available){$('status').textContent='No training run recorded.';return;}const {info,live,validation}=data,cfg=info.training||{},elapsed=info.run_elapsed_seconds??live.elapsed_seconds,latest=validation.at(-1),best=validation.length?Math.min(...validation.map(r=>r.val_loss)):(info.best_val_loss??null),remaining=cfg.max_seconds?Math.max(0,cfg.max_seconds-elapsed):null;$('status').textContent=(info.status==='training'?'Training':info.status==='complete'?'Complete':info.status||'Unknown')+(info.status==='training'&&data.update_age_seconds>30?' · waiting for a fresh update':'');$('cards').replaceChildren(card('Training loss',fmt(live.loss)),card('Validation loss',fmt(latest?.val_loss)),card('Best validation',fmt(best)),card('Learning rate',Number.isFinite(live.lr)?live.lr.toExponential(2):'—'),card('Elapsed',time(elapsed)),card(info.status==='training'?'Time remaining':'Stop reason',info.status==='training'?(info.curriculum?'No time limit':time(remaining)):(info.stop_reason||'Finished')));$('progress').value=info.status==='complete'?100:info.curriculum?Math.min(100,info.curriculum.phase==='huggingface'?info.curriculum.hf_total_percent/125*100:info.curriculum.custom_phase_percent/400*100):cfg.max_seconds?Math.min(100,elapsed/cfg.max_seconds*100):Math.min(100,(live.step||0)/(cfg.max_iters||1)*100);plot(data.training_history||[],'training-chart','loss');plot(validation);$('meta').textContent='Step '+(info.completed_steps??live.step??'—')+' · GPU memory '+Math.round(live.gpu_peak_mb||0)+' MB · Floating-point training'+(info.curriculum?' · Phase: '+info.curriculum.phase+' · HF total '+info.curriculum.hf_total_percent.toFixed(2)+'% · Custom fine-tuning '+info.curriculum.custom_phase_percent.toFixed(2)+'% · Recent custom loss '+fmt(info.curriculum.custom_recent_loss):'');$('freshness').textContent='Updated '+Math.round(data.update_age_seconds||0)+'s ago';}catch(e){$('status').textContent='Connection lost · retrying…';}finally{setTimeout(update,3000);}}update();
</script></body></html>
