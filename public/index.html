:root{color-scheme:dark;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#000;color:#eee}*{box-sizing:border-box}body{margin:0;background:#000}main{max-width:780px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:22px 22px max(14px,env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;padding:0 0 24px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.model-picker{position:relative;display:inline-flex;align-items:center;gap:6px;min-width:0;margin-right:12px;font-size:14px;font-weight:600}.model-picker>svg{width:15px;height:15px}.model-picker select{position:absolute;inset:0;width:100%;height:100%;opacity:0}.model-picker:focus-within{outline:2px solid #777;outline-offset:6px;border-radius:4px}.loading{display:flex;gap:5px;align-items:center;height:26px}.loading i{width:5px;height:5px;border-radius:50%;background:#aaa;animation:pulse 1.1s infinite ease-in-out}.loading i:nth-child(2){animation-delay:.15s}.loading i:nth-child(3){animation-delay:.3s}@keyframes pulse{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){.loading i{animation:none}}select{max-width:100%;width:auto;color:#eee;background:#000;border:0;border-radius:8px;font:inherit;font-size:14px;font-weight:600;padding:8px 4px;cursor:pointer;text-overflow:ellipsis}select:focus-visible{outline:2px solid #777;outline-offset:2px}option{background:#151515;color:#eee}option:disabled{color:#777}h1{font-size:18px;letter-spacing:-.5px;font-weight:600;margin:0}button{font:inherit;cursor:pointer;border:0;color:#eee;background:transparent;display:grid;place-items:center;flex-shrink:0;width:40px;height:40px;border-radius:50%;padding:0}button:hover{background:#1c1c1c}button:disabled{opacity:.4;cursor:wait}button:focus-visible{outline:2px solid #777;outline-offset:3px}svg{width:22px;height:22px;display:block}#messages{flex:1;padding:24px 0 16px;min-height:0}.message{margin:0 0 32px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}.user{text-align:right;margin-left:18%;color:#ccc}.assistant{text-align:left;margin-right:8%}.error{color:#e5a1a1}footer{position:sticky;bottom:0;background:#000;padding:12px 0 0}form{display:flex;align-items:center;gap:10px;background:#151515;border:1px solid #292929;border-radius:30px;padding:7px 8px 7px 20px}form:focus-within{border-color:#555}textarea{resize:none;flex:1;background:transparent;border:0;outline:0;color:#eee;font:inherit;font-size:16px;line-height:1.5;height:24px;max-height:144px;padding:0;min-width:0}textarea::placeholder{color:#777}#send{background:#eee;color:#000;width:38px;height:38px;align-self:flex-end}#send:hover{background:#ccc}@media(max-width:500px){main{padding:16px 16px max(12px,env(safe-area-inset-bottom))}header{padding-bottom:14px}h1{font-size:18px}.message{font-size:16px}.assistant{margin-right:2%}}
.markdown{white-space:normal}.markdown p{margin:0 0 14px}.markdown p:last-child{margin-bottom:0}.markdown h1,.markdown h2,.markdown h3{font-size:1.15em;margin:20px 0 10px}.markdown ul,.markdown ol{padding-left:24px;margin:10px 0 16px}.markdown li{margin:4px 0}.markdown code{font: .88em ui-monospace,SFMono-Regular,Consolas,monospace;background:#1c1c1c;padding:2px 5px;border-radius:4px}.markdown pre{overflow-x:auto;background:#151515;border:1px solid #292929;border-radius:12px;padding:14px;white-space:pre;margin:14px 0}.markdown pre code{background:none;padding:0}.markdown blockquote{border-left:2px solid #555;margin:12px 0;padding-left:14px;color:#aaa}.markdown a{color:#c5bbeb;text-decoration:underline}.markdown hr{border:0;border-top:1px solid #333;margin:20px 0}.markdown .katex-display{overflow-x:auto;overflow-y:hidden;padding:6px 0;margin:14px 0}.markdown .katex{font-size:1.08em}</style></head><body><main><header><div class="model-picker"><label for="model" class="sr-only">Model</label><span id="model-name" aria-hidden="true">AgmGPT-5-It</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg><select id="model" aria-label="Model"><option value="instruct" selected>AgmGPT-5-It</option></select></div><button id="clear" type="button" aria-label="New chat" title="New chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></header><section id="messages" aria-live="polite" aria-label="Conversation"></section><footer><form id="form"><textarea id="input" rows="1" maxlength="4000" aria-label="Message" placeholder="Message…" required></textarea><button id="send" type="submit" aria-label="Send message" title="Send message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></form></footer></main><script>
const form=document.querySelector('#form'),input=document.querySelector('#input'),messages=document.querySelector('#messages'),send=document.querySelector('#send'),clear=document.querySelector('#clear');let history=[],busy=false;const model=document.querySelector('#model');model.addEventListener('change',()=>{document.querySelector('#model-name').textContent=model.selectedOptions[0].textContent;history=[];messages.replaceChildren();});
function resize(){input.style.height='24px';input.style.height=Math.min(144,input.scrollHeight)+'px';}input.addEventListener('input',resize);
function add(role,text,error=false){const el=document.createElement('div');el.className='message '+role+(error?' error':'');el.textContent=text;messages.append(el);el.scrollIntoView({block:'end',behavior:'smooth'});return el;}

function inlineMarkdown(parent,text){
 const pattern=/(\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]|\$\$[\s\S]*?\$\$|\$[^$\n]+\$|`[^`\n]+`|\*\*[^*\n]+\*\*|__[^_\n]+__|\*[^*\n]+\*|\[[^\]\n]+\]\([^\s)]+\))/g;let cursor=0;
 for(const match of text.matchAll(pattern)){parent.append(document.createTextNode(text.slice(cursor,match.index)));const raw=match[0];let node;
  if(raw.startsWith('\\(')||raw.startsWith('\\[')||raw.startsWith('$')){node=document.createTextNode(raw);}
  else if(raw.startsWith('`')){node=document.createElement('code');node.textContent=raw.slice(1,-1);}
  else if(raw.startsWith('**')||raw.startsWith('__')){node=document.createElement('strong');node.textContent=raw.slice(2,-2);}
  else if(raw.startsWith('*')){node=document.createElement('em');node.textContent=raw.slice(1,-1);}
  else{const link=raw.match(/^\[([^\]]+)\]\(([^)]+)\)$/);let url;try{url=new URL(link[2]);}catch{}if(url&&['http:','https:'].includes(url.protocol)){node=document.createElement('a');node.textContent=link[1];node.href=url.href;node.target='_blank';node.rel='noopener noreferrer';}else{node=document.createTextNode(raw);}}
  parent.append(node);cursor=match.index+raw.length;
 }parent.append(document.createTextNode(text.slice(cursor)));
}

function renderMath(target){
 if(typeof window.renderMathInElement!=='function')return;
 window.renderMathInElement(target,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],ignoredTags:['script','noscript','style','textarea','pre','code','option'],throwOnError:false,trust:false,strict:'ignore',maxExpand:500,maxSize:20});
}
document.addEventListener('DOMContentLoaded',()=>{for(const el of document.querySelectorAll('.markdown'))renderMarkdown(el,el.dataset.source||el.textContent);});

function renderMarkdown(target,text){
 const fragment=document.createDocumentFragment(),lines=text.replace(/\r\n?/g,'\n').split('\n');let i=0;
 const isBlock=line=>/^\s*(```|#{1,3}\s|[-*+]\s|\d+\.\s|>\s?|---\s*$)/.test(line);
 while(i<lines.length){const line=lines[i];if(!line.trim()){i++;continue;}
  if(/^\s*```/.test(line)){i++;const body=[];while(i<lines.length&&!/^\s*```/.test(lines[i]))body.push(lines[i++]);if(i<lines.length)i++;const pre=document.createElement('pre'),code=document.createElement('code');code.textContent=body.join('\n');pre.append(code);fragment.append(pre);continue;}
  const heading=line.match(/^\s*(#{1,3})\s+(.+)$/);if(heading){const el=document.createElement('h'+heading[1].length);inlineMarkdown(el,heading[2]);fragment.append(el);i++;continue;}
  if(/^\s*---\s*$/.test(line)){fragment.append(document.createElement('hr'));i++;continue;}
  const item=line.match(/^\s*([-*+]|\d+\.)\s+(.+)$/);if(item){const ordered=/\d/.test(item[1]);const list=document.createElement(ordered?'ol':'ul');if(ordered)list.start=parseInt(item[1]);while(i<lines.length){const next=lines[i].match(/^\s*([-*+]|\d+\.)\s+(.+)$/);if(!next||/\d/.test(next[1])!==ordered)break;const li=document.createElement('li');inlineMarkdown(li,next[2]);list.append(li);i++;}fragment.append(list);continue;}
  if(/^\s*>/.test(line)){const quote=document.createElement('blockquote'),body=[];while(i<lines.length&&/^\s*>/.test(lines[i]))body.push(lines[i++].replace(/^\s*>\s?/,''));inlineMarkdown(quote,body.join(' '));fragment.append(quote);continue;}
  const body=[line];i++;while(i<lines.length&&lines[i].trim()&&!isBlock(lines[i]))body.push(lines[i++]);const para=document.createElement('p');inlineMarkdown(para,body.join('\n'));fragment.append(para);
 }target.classList.add('markdown');target.dataset.source=text;target.replaceChildren(fragment);renderMath(target);
}

form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(busy||!text)return;busy=true;send.disabled=true;clear.disabled=true;model.disabled=true;input.value='';resize();add('user',text);const pending=add('assistant','');pending.classList.add('loading');pending.setAttribute('aria-label','Generating response');for(let i=0;i<3;i++)pending.append(document.createElement('i'));let complete=false,reply='';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history,model:model.value})});if(!r.ok){const data=await r.json();throw Error(data.error||'Request failed');}const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='';function consume(line){if(!line.trim())return;const data=JSON.parse(line);if(data.type==='error')throw Error(data.error);if(data.type==='token'||data.type==='done'){pending.classList.remove('loading');pending.removeAttribute('aria-label');reply=data.type==='done'?data.reply:data.text;if(model.value==='instruct')renderMarkdown(pending,reply);else pending.textContent=reply;if(data.type==='done')complete=true;if(window.innerHeight+window.scrollY>=document.body.scrollHeight-220)pending.scrollIntoView({block:'end'});}}while(true){const {value,done}=await reader.read();buffer+=decoder.decode(value,{stream:!done});let index;while((index=buffer.indexOf('\n'))>=0){consume(buffer.slice(0,index));buffer=buffer.slice(index+1);}if(done){if(buffer.trim())consume(buffer);break;}}if(!complete)throw Error('Connection ended before the reply finished.');history.push({user:text,ai:reply});history=history.slice(-3);}catch(err){pending.classList.remove('loading');pending.removeAttribute('aria-label');pending.classList.add('error');pending.textContent=(reply?reply+'\n\n':'')+err.message;}finally{busy=false;send.disabled=false;clear.disabled=false;model.disabled=false;}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();form.requestSubmit();}});clear.addEventListener('click',()=>{if(busy)return;history=[];messages.replaceChildren();input.value='';resize();input.focus();});
